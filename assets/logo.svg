  <!-- Row 11  base -->
  <rect x="6"  y="66" width="6" height="6" fill="#1E3A8A"/>
  <rect x="12" y="66" width="6" height="6" fill="#1E3A8A"/>
  <rect x="18" y="66" width="6" height="6" fill="#1E3A8A"/>
  <rect x="24" y="66" width="6" height="6" fill="#1D4ED8"/>
  <rect x="30" y="66" width="6" height="6" fill="#1D4ED8"/>
