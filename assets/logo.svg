  <!-- Row 10 -->
  <rect x="6"  y="60" width="6" height="6" fill="#1E3A8A"/>
  <rect x="12" y="60" width="6" height="6" fill="#1E3A8A"/>
  <rect x="18" y="60" width="6" height="6" fill="#1D4ED8"/>
  <rect x="24" y="60" width="6" height="6" fill="#1D4ED8"/>
  <rect x="30" y="60" width="6" height="6" fill="#1D4ED8"/>
  <rect x="36" y="60" width="6" height="6" fill="#3B82F6"/>
  <rect x="42" y="60" width="6" height="6" fill="#3B82F6"/>
  <rect x="48" y="60" width="6" height="6" fill="#3B82F6"/>
  <rect x="54" y="60" width="6" height="6" fill="#3B82F6"/>
  <rect x="60" y="60" width="6" height="6" fill="#3B82F6"/>
  <rect x="66" y="60" width="6" height="6" fill="#3B82F6"/>
  <rect x="72" y="60" width="6" height="6" fill="#3B82F6"/>
  <rect x="78" y="60" width="6" height="6" fill="#3B82F6"/>
