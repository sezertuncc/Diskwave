<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="96" height="96" rx="20" fill="#0F172A"/>

  <!-- Pixel art wave  6px grid, 16�16 -->
  <!-- Color palette:
       #93C5FD = light blue (foam / crest)
       #3B82F6 = mid blue
       #1D4ED8 = deep blue
       #1E3A8A = darkest blue (wave body)
  -->

  <!-- Row 3  crest tip -->
  <rect x="36" y="18" width="6" height="6" fill="#93C5FD"/>
  <rect x="42" y="18" width="6" height="6" fill="#93C5FD"/>

  <!-- Row 4 -->
  <rect x="30" y="24" width="6" height="6" fill="#3B82F6"/>
  <rect x="36" y="24" width="6" height="6" fill="#93C5FD"/>
  <rect x="42" y="24" width="6" height="6" fill="#93C5FD"/>
  <rect x="48" y="24" width="6" height="6" fill="#3B82F6"/>

  <!-- Row 5 -->
  <rect x="24" y="30" width="6" height="6" fill="#3B82F6"/>
  <rect x="30" y="30" width="6" height="6" fill="#93C5FD"/>
  <rect x="36" y="30" width="6" height="6" fill="#93C5FD"/>
  <rect x="42" y="30" width="6" height="6" fill="#93C5FD"/>
  <rect x="48" y="30" width="6" height="6" fill="#93C5FD"/>
  <rect x="54" y="30" width="6" height="6" fill="#3B82F6"/>

  <!-- Row 6  wave body begins -->
  <rect x="18" y="36" width="6" height="6" fill="#1D4ED8"/>
  <rect x="24" y="36" width="6" height="6" fill="#3B82F6"/>
  <rect x="30" y="36" width="6" height="6" fill="#93C5FD"/>
  <rect x="36" y="36" width="6" height="6" fill="#93C5FD"/>
  <rect x="42" y="36" width="6" height="6" fill="#3B82F6"/>
  <rect x="48" y="36" width="6" height="6" fill="#3B82F6"/>
  <rect x="54" y="36" width="6" height="6" fill="#3B82F6"/>
  <rect x="60" y="36" width="6" height="6" fill="#1D4ED8"/>

  <!-- Row 7 -->
  <rect x="12" y="42" width="6" height="6" fill="#1E3A8A"/>
  <rect x="18" y="42" width="6" height="6" fill="#1D4ED8"/>
  <rect x="24" y="42" width="6" height="6" fill="#3B82F6"/>
  <rect x="30" y="42" width="6" height="6" fill="#3B82F6"/>
  <rect x="36" y="42" width="6" height="6" fill="#1D4ED8"/>
  <rect x="42" y="42" width="6" height="6" fill="#1D4ED8"/>
  <rect x="48" y="42" width="6" height="6" fill="#3B82F6"/>
  <rect x="54" y="42" width="6" height="6" fill="#3B82F6"/>
  <rect x="60" y="42" width="6" height="6" fill="#3B82F6"/>
  <rect x="66" y="42" width="6" height="6" fill="#1D4ED8"/>

  <!-- Row 8  wave curl -->
  <rect x="12" y="48" width="6" height="6" fill="#1E3A8A"/>
  <rect x="18" y="48" width="6" height="6" fill="#1D4ED8"/>
  <rect x="24" y="48" width="6" height="6" fill="#1D4ED8"/>
  <rect x="30" y="48" width="6" height="6" fill="#1D4ED8"/>
