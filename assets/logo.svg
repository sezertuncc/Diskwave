  <!-- Row 12  sea bottom -->
  <rect x="6"  y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="12" y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="18" y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="24" y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="30" y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="36" y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="42" y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="48" y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="54" y="72" width="6" height="6" fill="#1E3A8A"/>
  <rect x="60" y="72" width="6" height="6" fill="#1E3A8A"/>
