  <rect x="42" y="66" width="6" height="6" fill="#1D4ED8"/>
  <rect x="48" y="66" width="6" height="6" fill="#1D4ED8"/>
  <rect x="54" y="66" width="6" height="6" fill="#1D4ED8"/>
