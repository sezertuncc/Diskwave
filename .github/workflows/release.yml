name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-dmg:
    name: Build & Package DMG
    runs-on: macos-14        # Apple Silicon runner, Xcode 15

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── macFUSE headers (build-time only, no kernel ext needed) ──────────
      - name: Install macFUSE
        run: |
          brew install --cask macfuse || true
          # If cask install skipped (already present or needs restart),
          # fall back to extracting just the headers from the DMG.
          if [ ! -f /usr/local/include/fuse/fuse.h ]; then
            MACFUSE_URL="https://github.com/osxfuse/osxfuse/releases/download/macfuse-4.7.2/macfuse-4.7.2.dmg"
            curl -fsSL "$MACFUSE_URL" -o /tmp/macfuse.dmg
            hdiutil attach /tmp/macfuse.dmg -nobrowse -quiet
            # Extract headers from the package payload
            pkgutil --expand-full "/Volumes/macFUSE/Install macFUSE.pkg" /tmp/macfuse_pkg || true
            sudo mkdir -p /usr/local/include/fuse /usr/local/lib
            sudo find /tmp/macfuse_pkg -name "*.h" -exec cp {} /usr/local/include/fuse/ \; 2>/dev/null || true
            sudo find /tmp/macfuse_pkg -name "libfuse*.dylib" -exec cp {} /usr/local/lib/ \; 2>/dev/null || true
            hdiutil detach "/Volumes/macFUSE" -quiet || true
          fi

      # ── Xcode version ────────────────────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # ── Swift packages ────────────────────────────────────────────────────
      - name: Resolve Swift packages
        working-directory: client
        run: xcodebuild -resolvePackageDependencies -project DiskWave.xcodeproj -scheme DiskWave

      # ── Archive ──────────────────────────────────────────────────────────
      - name: Build archive
        working-directory: client
        run: |
          xcodebuild archive \
            -project DiskWave.xcodeproj \
            -scheme DiskWave \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/DiskWave.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # ── Export .app ──────────────────────────────────────────────────────
      - name: Export app
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/DiskWave.xcarchive/Products/Applications/DiskWave.app" \
                "$RUNNER_TEMP/export/DiskWave.app"

      # ── Ad-hoc sign (Gatekeeper bypass instructions in README) ───────────
      - name: Ad-hoc sign
        run: codesign --force --deep --sign "-" "$RUNNER_TEMP/export/DiskWave.app"

      # ── create-dmg ───────────────────────────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Diskwave" \
            --volicon "assets/logo.png" \
            --background "assets/logo.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "DiskWave.app" 150 185 \
            --hide-extension "DiskWave.app" \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "$RUNNER_TEMP/DiskWave.dmg" \
            "$RUNNER_TEMP/export/" || true
          # create-dmg exits 1 if no Applications shortcut, that's fine
          ls -lh "$RUNNER_TEMP/DiskWave.dmg"

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Diskwave ${{ github.ref_name }}"
          body: |
            ## Install

            1. Download **DiskWave.dmg** below
            2. Open it and drag DiskWave to Applications
            3. Launch and enter your server address + pairing code
            4. `/Volumes/Diskwave` appears in Finder automatically

            **Server setup:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/sezertuncc/Diskwave/main/install.sh | sudo bash
            ```

            **Upgrade existing server:**
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/sezertuncc/Diskwave/main/install.sh) upgrade
            ```

            > First launch may show a Gatekeeper warning. Right-click the app → Open to proceed.
          files: |
            ${{ runner.temp }}/DiskWave.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}